<!DOCTYPE html>
<html>
<head>
<title>Bird vs Drone AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background: linear-gradient(to right,#0f2027,#203a43,#2c5364);
color:white;
}
.card{
background: rgba(255,255,255,0.08);
border-radius:15px;
}
</style>
</head>

<body>

<div class="container-fluid mt-3">
<h2 class="text-center">🐦 Bird vs 🤖 Drone AI</h2>

<div class="row">

<div class="col-md-4">

<div class="card p-3 mb-3">
<h5>Image</h5>
<input type="file" id="imageInput" class="form-control">
<select id="mode" class="form-select mt-2">
<option value="classification">Classification</option>
<option value="detection">Detection</option>
</select>
<button onclick="uploadImage()" class="btn btn-primary mt-2 w-100">Analyze</button>
</div>

<div class="card p-3 mb-3">
<h5>Video</h5>
<input type="file" id="videoInput" class="form-control">
<button onclick="uploadVideo()" class="btn btn-warning mt-2 w-100">Detect</button>
</div>

<div class="card p-3 mb-3">
<h5>Laptop Camera</h5>
<button onclick="startServerCam()" class="btn btn-danger w-100">Start</button>
</div>

<div class="card p-3 mb-3">
<h5>Phone Camera</h5>
<button onclick="startPhoneCam()" class="btn btn-success w-100">Start</button>
<button onclick="stopPhoneCam()" class="btn btn-secondary mt-2 w-100">Stop</button>
</div>

</div>

<div class="col-md-8">
<div class="card p-3">

<img id="resultImg" class="img-fluid"/>
<video id="resultVideo" controls class="img-fluid"></video>
<video id="camera" autoplay playsinline class="img-fluid"></video>
<img id="liveResult" class="img-fluid"/>
<h4 id="resultText"></h4>

</div>
</div>

</div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
